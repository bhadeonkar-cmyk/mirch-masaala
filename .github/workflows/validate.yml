name: Validate Mirch Masaala app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-check:
    name: Check inline JavaScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run source and order lifecycle QA checks
        run: node scripts/check-inline-js.cjs
      - name: Parse the Supabase integration JavaScript
        run: node --check supabase-live.js

  sql-integration:
    name: Exercise accounting functions in PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mirch_masaala_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mirch_masaala_qa"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: mirch_masaala_qa
      PGPASSWORD: postgres
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Create isolated Supabase schema fixture
        run: psql -v ON_ERROR_STOP=1 -f scripts/sql-qa-fixture.sql
      - name: Compile accounting migration in PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f supabase/order-management-accounting.sql
      - name: Exercise cancellation, cleanup, payments and stats
        run: psql -v ON_ERROR_STOP=1 -f scripts/check-accounting-behavior.sql
      - name: Compile and exercise party and payment-verification migrations
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/party-bookings.sql
          psql -v ON_ERROR_STOP=1 -f supabase/customer-payment-confirmation.sql
          psql -v ON_ERROR_STOP=1 -f scripts/check-party-bookings.sql
          psql -v ON_ERROR_STOP=1 -f scripts/check-payment-confirmation.sql
          psql -v ON_ERROR_STOP=1 -f supabase/party-bookings.sql
          psql -v ON_ERROR_STOP=1 -f supabase/customer-payment-confirmation.sql
          psql -v ON_ERROR_STOP=1 -f supabase/table-visits.sql
          psql -v ON_ERROR_STOP=1 -f supabase/visit-billing-upgrade.sql
          psql -v ON_ERROR_STOP=1 -f supabase/customer-cash-counter.sql
          psql -v ON_ERROR_STOP=1 -f scripts/check-cash-counter-release.sql
          # Re-running the older alert migrations must preserve the new cash alert type.
          psql -v ON_ERROR_STOP=1 -f supabase/party-bookings.sql
          psql -v ON_ERROR_STOP=1 -f supabase/customer-payment-confirmation.sql
          psql -v ON_ERROR_STOP=1 -f supabase/customer-cash-counter.sql
          psql -v ON_ERROR_STOP=1 -c "DO \$qa\$ BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM pg_constraint
              WHERE conrelid='public.mm_restaurant_notifications'::regclass
                AND conname='mm_restaurant_notifications_type_check'
                AND pg_get_constraintdef(oid) ILIKE '%CASH_AT_COUNTER%'
            ) THEN
              RAISE EXCEPTION 'QA failed: re-running alert migrations removed CASH_AT_COUNTER';
            END IF;
          END \$qa\$;"
      - name: Verify secure guest ordering and assigned waiter alerts
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/visit-service-controls.sql
          psql -v ON_ERROR_STOP=1 -f scripts/check-visit-service-controls.sql
          psql -v ON_ERROR_STOP=1 -f supabase/visit-service-controls.sql
          psql -v ON_ERROR_STOP=1 -c "DO \$qa\$ BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM pg_constraint
              WHERE conrelid='public.mm_restaurant_notifications'::regclass
                AND conname='mm_restaurant_notifications_type_check'
                AND pg_get_constraintdef(oid) ILIKE '%CASH_AT_COUNTER%'
                AND pg_get_constraintdef(oid) ILIKE '%GUEST_LEFT_UNPAID%'
            ) THEN
              RAISE EXCEPTION 'QA failed: rerunning the visit migration lost a required notification type';
            END IF;
          END \$qa\$;"
      - name: Verify accounting migration is safe to re-run
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/order-management-accounting.sql
          psql -v ON_ERROR_STOP=1 -c "DO \$qa\$ BEGIN
            IF (SELECT count(*) FROM public.order_payments WHERE ticket_id = 'MM-T2-PAID') <> 1 THEN
              RAISE EXCEPTION 'QA failed: re-running migration duplicated a recorded payment';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM public.orders WHERE ticket_id = 'MM-T2-NEW' AND is_test_order AND archived_at IS NOT NULL AND status = 'CANCELLED') THEN
              RAISE EXCEPTION 'QA failed: re-running migration changed archived test cleanup';
            END IF;
          END \$qa\$;"
      - name: Verify dish options and table capacity migration
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/menu-item-options-and-table-capacity.sql
          psql -v ON_ERROR_STOP=1 -f scripts/check-menu-item-options.sql
          psql -v ON_ERROR_STOP=1 -f supabase/menu-item-options-and-table-capacity.sql
