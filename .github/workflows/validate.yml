name: Validate Mirch Masaala app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-check:
    name: Check inline JavaScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Parse the app's inline JavaScript
        run: node scripts/check-inline-js.cjs
      - name: Parse the Supabase integration JavaScript
        run: node --check supabase-live.js
