name: Validate Mirch Masaala app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-check:
    name: Check inline JavaScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run source and order lifecycle QA checks
        run: node scripts/check-inline-js.cjs
      - name: Parse the Supabase integration JavaScript
        run: node --check supabase-live.js
      - name: Parse the app-wide English/Marathi language layer
        run: node --check app-language.js

  sql-integration:
    name: Exercise accounting functions in PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mirch_masaala_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mirch_masaala_qa"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: mirch_masaala_qa
      PGPASSWORD: postgres
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Create isolated Supabase schema fixture
        run: psql -v ON_ERROR_STOP=1 -f scripts/sql-qa-fixture.sql
      - name: Compile accounting migration in PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f supabase/order-management-accounting.sql
      - name: Exercise cancellation, cleanup, payments and stats
        run: psql -v ON_ERROR_STOP=1 -f scripts/check-accounting-behavior.sql
      - name: Compile and exercise party and payment-verification migrations
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/role-notifications.sql
          psql -v ON_ERROR_STOP=1 -f supabase/party-bookings.sql
          psql -v ON_ERROR_STOP=1 -f supabase/customer-payment-confirmation.sql
          psql -v ON_ERROR_STOP=1 -f scripts/check-party-bookings.sql
          psql -v ON_ERROR_STOP=1 -f scripts/check-payment-confirmation.sql
          psql -v ON_ERROR_STOP=1 -f supabase/party-bookings.sql
          psql -v ON_ERROR_STOP=1 -f supabase/customer-payment-confirmation.sql
          psql -v ON_ERROR_STOP=1 -f supabase/table-visits.sql
          psql -v ON_ERROR_STOP=1 -f supabase/visit-billing-upgrade.sql
          psql -v ON_ERROR_STOP=1 -f supabase/customer-cash-counter.sql
          # Re-running the older alert migrations must preserve the new cash alert type.
          psql -v ON_ERROR_STOP=1 -f supabase/party-bookings.sql
          psql -v ON_ERROR_STOP=1 -f supabase/customer-payment-confirmation.sql
          psql -v ON_ERROR_STOP=1 -f supabase/customer-cash-counter.sql
          psql -v ON_ERROR_STOP=1 -c "DO \$qa\$ BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM pg_constraint
              WHERE conrelid='public.mm_restaurant_notifications'::regclass
                AND conname='mm_restaurant_notifications_type_check'
                AND pg_get_constraintdef(oid) ILIKE '%CASH_AT_COUNTER%'
            ) THEN
              RAISE EXCEPTION 'QA failed: re-running alert migrations removed CASH_AT_COUNTER';
            END IF;
          END \$qa\$;"
      - name: Verify secure guest ordering and assigned waiter alerts
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/visit-service-controls.sql
          psql -v ON_ERROR_STOP=1 -f scripts/check-visit-service-controls.sql
          psql -v ON_ERROR_STOP=1 -f supabase/visit-service-controls.sql
          # Compile the optional push migration against the complete notification schema.
          psql -v ON_ERROR_STOP=1 -f supabase/staff-push-notifications.sql
          # Simulate a legacy install where the preference column exists but lacks its contract.
          psql -v ON_ERROR_STOP=1 -c "ALTER TABLE public.mm_staff_push_subscriptions DROP CONSTRAINT mm_staff_push_subscriptions_language_check; ALTER TABLE public.mm_staff_push_subscriptions ALTER COLUMN preferred_language DROP DEFAULT, ALTER COLUMN preferred_language DROP NOT NULL, ALTER COLUMN preferred_language TYPE character varying;"
          # The migration must repair the existing column in place and be safe to re-run.
          psql -v ON_ERROR_STOP=1 -f supabase/staff-push-notifications.sql
          psql -v ON_ERROR_STOP=1 -c "DO \$qa\$ BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema='public' AND table_name='mm_staff_push_subscriptions'
                AND column_name='preferred_language' AND data_type='text'
                AND is_nullable='NO' AND column_default ILIKE '%en%'
            ) THEN
              RAISE EXCEPTION 'QA failed: push language column default/nullability/type was not repaired';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_constraint
              WHERE conrelid='public.mm_staff_push_subscriptions'::regclass
                AND conname='mm_staff_push_subscriptions_language_check'
            ) THEN
              RAISE EXCEPTION 'QA failed: push language CHECK constraint was not restored';
            END IF;
          END \$qa\$;"
          # Exercise same-table diner orders and cash settlement against the final visit RPC.
          psql -v ON_ERROR_STOP=1 -f scripts/check-cash-counter-release.sql
          psql -v ON_ERROR_STOP=1 -c "DO \$qa\$ BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM pg_constraint
              WHERE conrelid='public.mm_restaurant_notifications'::regclass
                AND conname='mm_restaurant_notifications_type_check'
                AND pg_get_constraintdef(oid) ILIKE '%CASH_AT_COUNTER%'
                AND pg_get_constraintdef(oid) ILIKE '%GUEST_LEFT_UNPAID%'
            ) THEN
              RAISE EXCEPTION 'QA failed: rerunning the visit migration lost a required notification type';
            END IF;
          END \$qa\$;"
           psql -v ON_ERROR_STOP=1 -c "DO \$qa\$ BEGIN
             IF NOT EXISTS (
               SELECT 1 FROM public.orders
               WHERE ticket_id='MM-GUEST-LEGACY-001' AND approval_status='PENDING'
                 AND status='NEW' AND customer_session_id IS NOT NULL
             ) THEN
               RAISE EXCEPTION 'QA failed: rerun did not backfill an unresolved legacy guest order';
             END IF;
             IF NOT EXISTS (
               SELECT 1 FROM public.mm_restaurant_notifications
               WHERE ticket_id='MM-GUEST-LEGACY-001' AND target_role='admin'
                 AND notification_type='ORDER_APPROVAL' AND resolved_at IS NULL
             ) THEN
               RAISE EXCEPTION 'QA failed: backfilled guest order has no open owner approval alert';
             END IF;
             IF EXISTS (
               SELECT 1 FROM public.mm_restaurant_notifications
               WHERE ticket_id='MM-GUEST-LEGACY-001' AND target_role='kitchen'
                 AND notification_type='NEW_ORDER' AND resolved_at IS NULL
             ) THEN
               RAISE EXCEPTION 'QA failed: backfilled pending guest order still alerts the kitchen';
             END IF;
           END \$qa\$;"
      - name: Switch to direct QR-to-kitchen ordering
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/direct-kitchen-qr-orders.sql
          psql -v ON_ERROR_STOP=1 -f scripts/check-direct-kitchen-orders.sql
          psql -v ON_ERROR_STOP=1 -f supabase/direct-kitchen-qr-orders.sql
          psql -v ON_ERROR_STOP=1 -c "DO \$qa\$ BEGIN
            IF (SELECT count(*) FROM public.mm_restaurant_notifications
                WHERE ticket_id='MM-QRO-DIRECT-001' AND target_role='kitchen'
                  AND notification_type='NEW_ORDER' AND resolved_at IS NULL) <> 1 THEN
              RAISE EXCEPTION 'QA failed: rerunning direct-kitchen migration duplicated or lost kitchen alert';
            END IF;
            IF EXISTS (SELECT 1 FROM public.orders
                       WHERE restaurant_id='a3702d10-6673-4c06-9783-1d61c945ecd5'::uuid
                         AND approval_status='PENDING') THEN
              RAISE EXCEPTION 'QA failed: rerunning migration left pending tickets';
            END IF;
          END \$qa\$;"
      - name: Verify accounting migration is safe to re-run
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/order-management-accounting.sql
          psql -v ON_ERROR_STOP=1 -c "DO \$qa\$ BEGIN
            IF (SELECT count(*) FROM public.order_payments WHERE ticket_id = 'MM-T2-PAID') <> 1 THEN
              RAISE EXCEPTION 'QA failed: re-running migration duplicated a recorded payment';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM public.orders WHERE ticket_id = 'MM-T2-NEW' AND is_test_order AND archived_at IS NOT NULL AND status = 'CANCELLED') THEN
              RAISE EXCEPTION 'QA failed: re-running migration changed archived test cleanup';
            END IF;
          END \$qa\$;"
      - name: Compile menu options and table capacity migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/menu-item-options-and-table-capacity.sql
      - name: Exercise menu options and table capacity QA
        run: psql -v ON_ERROR_STOP=1 -f scripts/check-menu-item-options.sql
      - name: Verify menu options migration is re-runnable
        run: psql -v ON_ERROR_STOP=1 -f supabase/menu-item-options-and-table-capacity.sql
      - name: Compile and test owner waiter, backup and reset tools
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/owner-operations-toolkit.sql
          psql -v ON_ERROR_STOP=1 -f scripts/check-owner-operations-toolkit.sql
          psql -v ON_ERROR_STOP=1 -f supabase/owner-operations-toolkit.sql
