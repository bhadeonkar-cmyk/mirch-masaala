<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#120c0a">
<title>Mirch Masaala — Desktop</title>
<style>
:root{--bg:#120c0a;--card:#1e1512;--gold:#d4a84b;--gold2:#f0d78c;--muted:#a89888;--line:rgba(212,168,75,.25)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
.bar{height:64px;display:flex;align-items:center;justify-content:space-between;padding:8px 18px;background:#120c0a;border-bottom:1px solid var(--line);position:relative;z-index:5}.brand{font-weight:800;color:var(--gold2);letter-spacing:.8px}.right{display:flex;gap:8px;align-items:center}.role-badge{display:inline-flex;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:#1e1512;color:#f0d78c;font-size:12px;font-weight:800;white-space:nowrap}.phone-btn{border:1px solid var(--line);background:#1e1512;color:#f0d78c;padding:9px 11px;border-radius:9px;font-weight:800;cursor:pointer;white-space:nowrap}.hint{font-size:11px;color:var(--muted);display:none}
.frame{width:100%;height:calc(100vh - 64px);border:0;display:block;background:#120c0a}
@media(max-width:800px){.hint{display:none}.bar{padding:8px 10px}.brand{font-size:13px}}
@media(max-width:520px){.bar{height:auto;min-height:64px;flex-wrap:wrap;gap:8px;padding:10px}.brand{width:100%;font-size:13px}.right{width:100%;gap:8px;justify-content:space-between}.role-badge{flex:1;min-width:0}.phone-btn{padding:8px 10px;font-size:12px}.frame{height:calc(100vh - 82px)}}
</style>
</head>
<body>
<header class="bar">
  <div class="brand">🌶️ MIRCH-MASAALA <span id="desktopRole" style="font-weight:600;color:var(--muted)">Owner Desktop</span></div>
  <div class="right">
    <span id="roleBadge" class="role-badge">👨‍💼 Owner workspace</span>
    <button id="phoneBtn" class="phone-btn" onclick="openPhoneView()" title="Return to this role's phone version">📱 Phone</button>
  </div>
</header>
<iframe id="app" class="frame" title="Mirch Masaala role-specific workspace"></iframe>
<script>
const frame=document.getElementById('app');
const roleParam = new URLSearchParams(window.location.search).get('role');
const activeRole = roleParam === 'kitchen' ? 'kitchen' : 'admin';
const roleLabel = activeRole === 'kitchen' ? 'Kitchen' : 'Owner';
document.title = 'Mirch Masaala — ' + roleLabel + ' Desktop';
document.getElementById('desktopRole').textContent = roleLabel + ' Desktop';
document.getElementById('roleBadge').textContent = activeRole === 'kitchen' ? '👨‍🍳 Kitchen workspace' : '👨‍💼 Owner workspace';

// This desktop window is pinned to one role for its entire lifetime.
// Role changes require opening that role's own URL and signing in separately.
frame.src='./?staff='+encodeURIComponent(activeRole);

function openPhoneView(){
  window.location.href='./?staff='+encodeURIComponent(activeRole);
}
</script>
</body>
</html>
