<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#120c0a">
<title>Mirch Masaala — Desktop</title>
<style>
:root{--bg:#120c0a;--card:#1e1512;--gold:#d4a84b;--gold2:#f0d78c;--muted:#a89888;--line:rgba(212,168,75,.25)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
.bar{height:64px;display:flex;align-items:center;justify-content:space-between;padding:8px 18px;background:#120c0a;border-bottom:1px solid var(--line);position:relative;z-index:5}.brand{font-weight:800;color:var(--gold2);letter-spacing:.8px}.right{display:flex;gap:8px;align-items:center}.switch{display:flex;gap:4px;padding:4px;background:#0b0807;border:1px solid var(--line);border-radius:12px}.switch button{border:0;background:transparent;color:var(--muted);padding:9px 14px;border-radius:9px;font-weight:800;cursor:pointer}.switch button.on{background:linear-gradient(135deg,#c4922e,#f0d78c);color:#1a1208}.hint{font-size:11px;color:var(--muted);display:none}
.frame{width:100%;height:calc(100vh - 64px);border:0;display:block;background:#120c0a}
@media(max-width:800px){.hint{display:none}.bar{padding:8px 10px}.brand{font-size:13px}.switch button{padding:8px 9px;font-size:12px}}
</style>
</head>
<body>
<header class="bar">
  <div class="brand">🌶️ MIRCH-MASAALA <span style="font-weight:500;color:var(--muted)">Desktop</span></div>
  <div class="right">
    <div class="switch" aria-label="Desktop role switch">
      <button id="ownerBtn" class="on" onclick="openRole('admin')">👨‍💼 Owner</button>
      <button id="kitchenBtn" onclick="openRole('kitchen')">👨‍🍳 Kitchen</button>
    </div>
  </div>
</header>
<iframe id="app" class="frame" title="Mirch Masaala app"></iframe>
<script>
const frame=document.getElementById('app');
function openRole(role){
  document.getElementById('ownerBtn').classList.toggle('on',role==='admin');
  document.getElementById('kitchenBtn').classList.toggle('on',role==='kitchen');
  // Keep the original app completely intact. The role is selected by opening
  // its existing staff entry flow; the normal password is still required.
  frame.src='./?staff=1#'+role;
}
openRole('admin');
</script>
</body>
</html>
